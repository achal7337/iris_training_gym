# Environment configuration: action budget, per-tool cost, and seeded
# failure-injection rates. Injection is keyed on (scenario_id, tool_name,
# call_index) so a given scenario fails identically on every run.

action_budget: 8

tool_costs:
  lookup_order: 1
  lookup_customer: 1
  read_policy: 1
  inspect_refund_history: 1
  issue_refund: 3
  escalate: 2
  reply_and_close: 1

failure_injection:
  lookup_order:
    stale_status_rate: 0.10   # a repeat call on the same order returns fresh
  lookup_customer:
    timeout_rate: 0.08        # transient TIMEOUT, succeeds on retry

read_policy:
  top_k: 2                    # structural retrieval cap, not a failure-injection rate
